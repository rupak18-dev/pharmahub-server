name: Deploy API to production

on:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Deploy to Render
        run: echo "Render auto-deploys from main via GitHub integration. Manual deploys via Render dashboard."
